<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <header class="header">
      <div class="header-sections search">
        <img src="Assets/magnify.svg" alt="" srcset="" />

      <div class="header-sections">notifications etc</div>

          <li><img src="Assets/history.svg" alt="history">History</li>
          <li><img src="Assets/checkbox-marked-circle-auto-outline.svg" alt="tasks">Tasks</li>
          <li><img src="Assets/account-group.svg" alt="communities">Communities</li>
          <li><img src="Assets/cog.svg" alt="settings cog">Settings</li>
          <li><img src="Assets/help-box.svg" alt="help">Support</li>
          <li><img src="Assets/shield-check.svg" alt="privacy shield">Privacy</li>
        </ul>
      </div>
    </div>

      <div class="projects">

        <div class="project">p1</div>

        <div class="project">p4</div>
        <div class="project">p5</div>
        <div class="project">p6</div>
      </div>
      <div class="cards">
        <h3>Announcements</h3>
        <div class="card">
          Lorem, ipsum dolor sit amet consectetur adipisicing elit.
        </div>
      </div>
      <div class="cards">

        <div class="card">Feed</div>
      </div>

    <script src="script.js"></script>
